global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']
      scheme: http
      timeout: 10s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node_exporter'
    static_configs:
      - targets: ['localhost:9100']
    scrape_interval: 10s
    scrape_timeout: 5s

  - job_name: 'blade_monitoring'
    static_configs:
      - targets: 
          - '10.11.0.15:9100'
          - '10.11.0.16:9100'
          - '10.11.0.17:9100'
    scrape_interval: 10s
    scrape_timeout: 5s
